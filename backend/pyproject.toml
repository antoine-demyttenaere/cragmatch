[project]
name = "fastapi-climbing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.7.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.5",
    "langchain-postgres>=0.0.18",
    "langchain-text-splitters>=1.1.2",
    "langchain-voyageai>=0.4.1",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.1.3",
    "pgvector>=0.3.6,<0.4",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0",
    "tzdata>=2026.4",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff.lint]
# Ruff's default rules: syntax errors, undefined names, unused imports.
# Real bugs only, no style opinions. Set explicitly so a ruff config
# elsewhere on this machine can't add rules.
select = ["E4", "E7", "E9", "F"]
